name: Build Hermes Windows EXE
on:
  workflow_dispatch: # 手动点击才启动打包

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Build bundled desktop installer
        run: |
          python scripts/bundles/desktop.py --commit ${{ github.sha }} --variant bundled

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hermes-Agent-Win-Setup
          path: apps/desktop/release/*.exe
          retention-days: 90
